  # Optimizer configuration
  optim:
    # AdamSPD: Adam with Selective Projection Decay (GT-RIPL).
    # Instead of standard weight decay (pulls toward zero) or L2-SP
    # (blanket penalty toward pretrained), SPD selectively decays
    # weights toward pretrained values *only when the gradient pushes
    # them further away*. This prevents forgetting while allowing
    # beneficial updates. The weight_decay parameter controls the
    # SPD decay strength (higher = stronger pull toward pretrained).
    # MEASURED, not assumed (1.3.0-nospd ablation, 2026-08-28): swapping in
    # plain AdamW on 1.3.0's exact LR trajectory, seed and data order left
    # the fleurs canaries unchanged (fr+en macro delta -0.05, noise) but
    # lost in-domain generalisation, with the gap growing every round:
    # 4-set avg 6.94 vs 6.22 at step 5000 (oli_drug +2.03, parhaf +0.33,
    # dictionary +0.31, drugs +0.22), macro 8.09 vs 7.63, and the AdamW arm
    # had already turned over (4000 -> 5000 worsened) while SPD was still
    # improving. So on this corpus SPD's anchored selective decay is doing
    # its work as a regulariser that helps held-out in-domain performance,
    # not just as an anti-forgetting brake. Kept, unscoped: encoder-only
    # scoping would need a code change (unregistered params decay toward
    # zero, see adam_spd.py) and the all-params version is already winning
    # on the monitored metric.
    _target_: nemo.collections.asr.optim.adam_spd.AdamSPD

    # Learning rate - critical hyperparameter
    # Adjust based on performance
    # Recommended for fine-tuning: 1e-5 to 5e-5
    # Lower (1e-5): More stable, safer for fine-tuning, slower convergence
    # Higher (5e-5): Faster convergence, risk of catastrophic forgetting
    lr: 2e-5

    # Adam parameters
    betas: [0.9, 0.999]
    # SPD decay strength — controls how strongly weights are pulled
    # back toward pretrained values (only when gradient diverges).
    # This replaces both AdamW weight_decay and L2-SP lambda.
    weight_decay: 0.01

    # Learning rate scheduler
    # Choose scheduler type and parameters
    sched:
      name: CosineAnnealing

      # Warmup steps - gradually increase LR from 0 to lr
      # Counted in OPTIMIZER steps (= batches / accumulate_grad_batches).
      # Measured in 1.4.0 with the CV rehearsal: 76,152 batches / accum 8
      # = 9,519 opt-steps per epoch.
      # 800 warmup steps = ~8% of the first epoch, about 40 min of ramp,
      # gentle on the newly-unfrozen encoder layers.
      warmup_steps: 800

      # Cosine horizon, in optimizer steps. Explicitly set so the anneal lands
      # at the end of the run instead of being cut off mid-decay.
      #
      # Recalibrated for cost batching, from a measured 1.604 batches/s on the
      # real manifests (was 2.07 with fixed batches of 4, but each batch now
      # carries twice the audio):
      #   1.604 * 864000 s / 8 accum = 173,000 opt-steps of pure training
      # less ~4% for validation passes and checkpoint writes -> ~166,000 in
      # 10 days.
      #
      # THIS IS THE TRAINING-LENGTH DECISION, not a safety limit: it sets the
      # SHAPE of the cosine. At ~8,910 opt-steps per epoch, 15,000 steps is
      # ~1.7 epochs, inside the max_epochs 2 ceiling below. Setting
      # this longer than the run actually goes is actively harmful: the best
      # checkpoint then gets taken mid-anneal at a high LR, having never had
      # its final decay, and a completed cosine at N epochs beats a cosine
      # truncated at N-of-20. Setting it shorter just parks the tail of the
      # run at min_lr (stable, simply no further annealing).
      #
      # 15,000 (measured: 1.58 epochs of the enlarged corpus), up from
      # 10,000 in 1.3.0; before that 23,800 in 1.2.0 and 95,178 in 1.1.0.
      #
      # The short-cosine idea was the central change in 1.3.0 and it worked:
      # no drift phase, the endpoint WAS the best point (7.21). Both earlier
      # runs had put their best macro under one and a half epochs (1.1.0 at
      # step 7,500 = 7.08; 1.2.0 at 15,432 = 9.61, still flattening) because
      # the corpus is a single TTS system whose hour count overstates its
      # acoustic diversity: extra passes mostly teach the model that one
      # voice, so the optimum arrives early and everything after it is drift.
      #
      # 1.1.0 hit that optimum with the LR still at peak, because the cosine
      # was sized for 12 epochs: (7500-800)/(95178-800) = 7% through, so LR was
      # 1.99e-5 of a 2e-5 peak. Its best checkpoint never got a final decay,
      # and the run then spent 32 hours annealing past the point it should have
      # stopped at, without saving a single further top-k checkpoint.
      #
      # Why 15,000 now and not 10,000 again: 1.3.0 was still improving at its
      # stop (~0.04 macro per 1,000 steps), so 10k was slightly short even on
      # the old data, and 1.4.0's corpus is both ~12% larger and genuinely
      # more diverse (Common Voice is real multi-speaker speech, not TTS), so
      # the early-optimum argument above has less bite. ~1.7 epochs keeps the
      # anneal landing on the same window per-epoch-wise while giving the
      # rehearsal mix time to work. (Post-run: it was right-sized, the best
      # checkpoint landed at 11,519 inside a flat 10.5k-14.5k plateau.)
      # Kept equal to trainer.max_steps below,
      # which is what actually ends the run; the config audit fails the run
      # if the two disagree.
      max_steps: 15000

      # Minimum learning rate at end of training
      # Set to 0 for full annealing, or 0.1*lr to keep some learning
      min_lr: 2e-6

      # For ReduceLROnPlateau (alternative scheduler):
      # name: ReduceLROnPlateau
      # mode: min
      # factor: 0.5
      # patience: 3
      # min_lr: 1e-6

  # SpecAugment - augmentation on spectrograms
  # This operates on mel-spectrograms, not raw audio
  # Very effective for ASR robustness
  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation

    # Frequency masking - masks out frequency bands
    freq_masks: 2  # Number of frequency bands to mask
    freq_width: 25  # Maximum width of each mask

    # Time masking - enabled for the UltiMed run: single TTS voice with
    # very regular pacing makes time-structure overfitting likely.
    # Float time_width = adaptive, each mask up to 5% of the utterance
    # (FastConformer recipes use 10 x 0.05; 5 is a gentler fine-tune dose).
    time_masks: 5
    time_width: 0.05

    # Cutout rectangles - random rectangular masks
    # rect_masks: 1  # Number of rectangles
    # rect_time: 5  # Max time dimension
    # rect_freq: 15  # Max frequency dimension

# Trainer configuration (PyTorch Lightning)
trainer:
  # GPU settings
  devices: 1  # Single GPU
  accelerator: gpu

  # DeepSpeed DROPPED for the UltiMed run. It only paid off when nearly
  # everything trained; now only ~120M params train, so optimizer state is
  # ~1.5 GB on GPU and the offload's PCIe traffic + engine overhead would
  # just slow down a 10-day run. Plain single-GPU strategy.
  # (To re-enable: strategy: deepspeed_stage_2_offload)
  strategy: auto

  # Training duration: WALL CLOCK is the real budget.
  # max_time stops cleanly mid-epoch when the budget is spent (Lightning
  # format "DD:HH:MM:SS"). CAVEAT: the timer counts time of the CURRENT
  # process only; it resets on every crash-relaunch/resume, so with the
  # relaunch wrapper the true total is "10 days of cumulative uptime since
  # the last crash" per launch. Shrink it on relaunches if you need a hard
  # calendar deadline.
  max_time: "10:00:00:00"
  # THE BINDING STOP. Lightning halts at whichever of max_steps and
  # max_epochs arrives first, and at the measured 9,519 opt-steps per epoch
  # this lands at 1.58 epochs, before max_epochs. Kept equal to optim.sched.max_steps so
  # the cosine finishes exactly as the run does: change one and you must change
  # the other. The config audit compares them and fails the run if they drift.
  #
  # Measured on 1.3.0: 1.358 batches/s including validation and checkpoints,
  # so 15,000 opt-steps (120,000 batches) is ~24.5 h.
  #
  # Freezing the encoder did NOT speed 1.2.0 up, contrary to what was expected
  # here before it was measured: 1.1.0 ran at ~1.50 batches/s with the same
  # N=4 this run uses. The encoder forward still runs in full, and the TDT
  # joint lattice ([B, T, U, V] at V=8198) dominates the step either way, so
  # skipping the encoder backward buys little. Do not assume a smaller
  # trainable set means a faster epoch. N=4 is also exactly 1.1.0's memory
  # profile, which ran 30+ h at these batch settings without an OOM. The CV
  # rehearsal clips are short (~5 s mean, 38 s cap applies regardless), so
  # they cannot produce a worse batch than the cost model was fitted on.
  max_steps: 15000

  # A ceiling only, never reached: max_steps above stops the run first. Left
  # above the real budget on purpose so that raising max_steps does not
  # silently truncate against an epoch limit nobody remembered to move.
  #
  # No early stopping is configured. save_top_k below is what protects the
  # result: the best checkpoint is kept whenever it occurs.
  max_epochs: 2

  # Precision - use 16-bit mixed precision for memory efficiency
  # This uses automatic mixed precision (AMP)
  precision: bf16-mixed

  # Gradient clipping - prevents exploding gradients
  gradient_clip_val: 1.0

  # Gradient accumulation - simulates larger batches
  # If you want effective batch_size of 32 but actual batch_size of 8:
  # set accumulate_grad_batches: 4
  # This updates weights every 4 batches
  # Pros: Trains like larger batch without VRAM cost
  # Cons: 4x slower weight updates
  #
  # Lowered from 16 to 8 to keep the optimizer step the same size as before
  # cost batching: batches now hold 7.7 clips on average instead of 4, so
  # 8 x 7.7 = 62 clips and 1104 audio-s per step, against 16 x 4 = 64 clips
  # and 1100 audio-s before. Same optimization dynamics, different batching.
  accumulate_grad_batches: 8

  # Validation settings
  # An epoch is ~11 h, so epoch-boundary validation is too coarse here.
  # Integer value = every N TRAINING BATCHES (not optimizer steps).
  #
  # 20000 in 1.1.0, 10000 in 1.2.0, 8000 since 1.3.0. The run is now 120,000
  # batches total, so 8000 gives one round per 1,000 opt-steps (14 rounds in
  # 1.4.0, not 15: the counter resets at the epoch boundary, which swallowed
  # the round at step 10000), with the last few inside the low-LR tail where
  # the best checkpoint is expected (1.3.0: endpoint was best; 1.4.0: best at
  # 11,519 of 15,000).
  #
  # Resolution matters because the optimum is a window that can be stepped
  # over. 1.1.0's macro bottomed at step 7,500, inside the first epoch,
  # between two rounds 20,000 batches apart.
  #
  # A full 15-set validation pass measures 4.5 min (246/289/283 s over 1.1.0's
  # three in-epoch rounds), so 14 rounds cost ~63 min of the ~24 h run. Must
  # stay < batches per epoch (measured 76,152 under cost batching with the CV
  # rehearsal) or Lightning errors out at startup.
  val_check_interval: 8000

  # Disable Lightning's built-in logger so NeMo's exp_manager can create
  # its own (tensorboard). Having both causes LoggerMisconfigurationError.
  logger: false

  # Disable Lightning's built-in checkpointing so NeMo's exp_manager can
  # manage checkpoints itself (see exp_manager.checkpoint_callback_params).
  enable_checkpointing: false

  # Deterministic training for reproducibility
  # Note: This may slightly slow down training
  deterministic: false

  # Logging
  log_every_n_steps: 50

  # Benchmarking - set false for deterministic training
  benchmark: false

  # Number of sanity validation steps at start
  # Useful for catching errors before full training
  num_sanity_val_steps: 2

# https://docs.nvidia.co./perso/nemo-framework/user-guide/lates./perso/nemotoolkit/asr/configs.html
decoding:
  # Greedy (not maes/beam search) on purpose. This decoding runs on every
  # validation step, so we want it fast: greedy is a single forward pass per
  # frame, while maes beam search is several times slower. The val_wer we
  # monitor only needs to track relative progress between checkpoints, and
  # greedy vs beam barely changes that ranking. Save maes for final inference
  # where the small accuracy gain is worth the extra compute.
  #
  # Measured on this exact model rather than assumed: on the FLEURS French
  # validation split, fp32 scores 4.90% WER greedy against 4.87% with MAES
  # beam 10, a 0.03 point difference. Beam over 6,395 validation clips x 38
  # rounds would add 9-18 h to the run for an offset far too small to reorder
  # any checkpoint.
  #
  # greedy_batch, not greedy: same output, batched across the utterances in a
  # validation batch instead of one at a time. Plain `greedy` here would be a
  # pure slowdown for identical results.
  #
  # WIRING NOTE: this block was read by NOTHING until 2026-08-23. The model
  # comes from ASRModel.from_pretrained(), which restores the checkpoint's own
  # config, so decoding was silently inherited from the .nemo (which happened
  # to specify greedy_batch/max_symbols 10, so the effective behaviour was
  # right by luck). main() now applies it explicitly via
  # change_decoding_strategy, so this block is genuinely in control. Putting
  # it under model: would NOT work: from_pretrained overwrites that.
  strategy: greedy_batch
  model_type: tdt
  durations: [0, 1, 2, 3, 4]
  greedy:
    # Cap on symbols emitted per encoder frame, the RNNT infinite-loop guard.
    # 10 is the value the pretrained checkpoint ships with.
    max_symbols: 10

# Log a punctuation- and case-insensitive WER next to the raw one, for every
# validation set and every macro below (<name>val_wer_norm and
# <macro>_norm, generated automatically so the source lists cannot drift).
#
# NeMo scores reference.split() against hypothesis.split(), so formatting
# counts as recognition error, and because split() keeps punctuation glued to
# its word a single comma costs a whole word:
#     reference   "... pancréatique exocrine, ainsi que ..."
#     hypothesis  "... pancréatique exocrine ainsi que ..."   one substitution
# Measured over 128,649 pairs from the 1.1.0 log: 15.89% raw against 13.79%
# normalised, so 2.10 points (13% relative) of every WER here is formatting.
#
# Both are logged and neither is "the" number: raw is what a reader sees on
# screen, normalised is what the model knows about the words. The checkpoint
# monitor stays on the RAW macro so curves stay comparable with 1.1.0.
#
# Note this does NOT expand numbers ("3" vs "trois"), a real error source in
# these transcripts, because doing it properly needs a French verbaliser and
# half-normalising would be worse than leaving it alone.
#
# Predecessor: train_ds.multitask_metrics_config asked for a WERNormalised via
# _target_. It never ran. Nothing in the codebase reads multitask_metrics_config
# (it is an AED/multitask key, and this is an RNNT model), and the module it
# pointed at was a symlink to a deleted file. Both failures were invisible
# because model.train_ds is a delegated subtree the config audit does not
# descend into. This replaces it with a path that actually executes.
normalised_wer: true

# Extra metrics computed as plain averages of already-logged validation
# metrics. Implemented by _MacroMetricCallback in
# examples/asr/speech_to_text_finetune_cached.py, which writes the result
# into trainer.callback_metrics so it can serve as the checkpoint monitor.
macro_metrics:
  # Checkpoint monitor for the UltiMed run: equal-weight macro of the two
  # FLEURS anchors (multilinguality / forgetting guard), the three main
  # in-domain UltiMed slices, and oli (see below). A gain on medical French
  # only counts if it does not cost general FR/EN. acronyms (tiny, noisy) and
  # parrot (out-of-domain, never trained) are tracked but kept out of the
  # monitor.
  #
  # oli_drug_sentence carries weight here despite being the smallest set,
  # because it is the ONLY real recorded human speech in the whole setup that
  # is also in-domain. Every training hour is synthetic (98.7% a single
  # Voxtral fr_female voice), and FLEURS is real but general rather than
  # medical, so without oli nothing in the monitor measures the actual
  # deployment condition: a human saying drug names. A checkpoint chosen
  # without it is chosen on TTS performance alone.
  #
  # Caveat to read it with: 205 clips / 30 min is a small sample, so its WER
  # is the noisiest component of the macro. It is one of six voices here
  # rather than the monitor on its own for exactly that reason, and
  # save_top_k: 5 leaves room to compare the finalists on oli directly.
  - name: "combined_macro_val_wer"
    sources:
      - "fleurs_frval_wer"
      - "fleurs_enval_wer"
      - "ultimed_dictionaryval_wer"
      - "ultimed_parhafval_wer"
      - "ultimed_drugsval_wer"
      - "oli_drug_sentenceval_wer"
  # Kept for comparability with previous runs' tensorboards.
  - name: "fleurs_fr_en_macro_val_wer"
    sources: ["fleurs_frval_wer", "fleurs_enval_wer"]

# Experiment manager - handles logging, checkpointing, etc.
# documentation: https://github.com/NVIDIA-NeM./perso/nemo/blob/412ab81dd5b17f763ee3aa723c67679698649a7./perso/nemo/utils/exp_manager.py
exp_manager:
  # Full layout: <exp_dir>/<exp_manager.name>/<version>/checkpoints/
  #
  # Left unset, exp_manager defaults this to "default", which is what runs used
  # to land under. That made the top-level `name:` pure decoration and meant
  # anything else ever trained on the same disk piled into the same directory
  # with only the version string telling runs apart. Pointed at ${name} on
  # 2026-08-23, while nemo_experiments/ was still empty so nothing had to move.
  # Changing it once a run has started would strand its checkpoints: resume
  # looks in <exp_dir>/<name>/<version>/checkpoints and would find an empty
  # directory, then restart from scratch without saying so.
  name: ${name}

  # Where checkpoints, .nemo files and tensorboard logs are written.
  # Set NEMO_EXP_DIR to put runs on another disk (checkpoints are several GB
  # each, and save_top_k + save_last + always_save_nemo multiplies that):
  #   NEMO_EXP_DIR=/mnt/spare_disk/nemo_experiments python examples/asr/...
  # Unset -> ./nemo_experiments, the historical location.
  # Kept as an env var rather than a hardcoded path so the config stays
  # machine-independent.
  # NOTE: resume_if_exists (below) looks inside this directory, so pointing it
  # at an empty disk means past runs are not found for resuming. Move the
  # existing nemo_experiments/ over if you want them to remain resumable.
  exp_dir: ${oc.env:NEMO_EXP_DIR,./nemo_experiments}

  # Checkpointing configuration
  # 1.x.x = the UltiMed-ASR-FR era (0.x.x was the drug_sentence/diy era).
  # The minor number is the training recipe, so it moves whenever the thing
  # being tested changes; the patch number is for fixes that do not.
  #
  # 1.0.0  first UltiMed retarget (25 s cap, fixed batch_size 4). Never run.
  # 1.1.0  cost batching (38 s cap, adaptive batch, oli_drug_sentence in
  #        val/test), encoder last 4 layers unfrozen, 12 epochs. Ran
  #        2026-08-24 to 08-26, stopped after 4.6 epochs: in-domain hit its
  #        noise floor by epoch 2 while English WER climbed 148%. Best macro
  #        7.08% at step 7,500. Its checkpoints are kept for comparison.
  # 1.2.0  encoder fully frozen, 3 epochs, validation twice as often. Tested
  #        whether the in-domain gain survives without encoder plasticity.
  #        Answer: not far enough. Forgetting fell to a seventh of 1.1.0's,
  #        but the macro flattened at 9.61, worse than 1.1.0's WORST point
  #        (9.11). Stopped after 1.95 epochs at step 15,432.
  # 1.3.0  back to 1.1.0's N=4 freeze; the change is the schedule. The run is
  #        sized to 10,000 opt-steps (1.26 epochs) so the cosine anneals onto
  #        the window both earlier runs pointed at instead of driving past it.
  #        First run to log the normalised WER alongside the raw one.
  #        Outcome: no drift phase, the endpoint IS the best point, but 7.21
  #        against 1.1.0@7500's 7.08: in-domain 5.67 vs 5.38, fleurs fr+en
  #        10.31 vs 10.47. Still falling ~0.04/1000 steps at the stop, so 10k
  #        was slightly short. Norm columns: macro 5.04, in-domain ~4.05.
  # 1.3.0-nospd  ablation arm, launched by perso/run_ablation_nospd.sh via
  #        hydra overrides (this file is not modified): AdamW instead of
  #        AdamSPD, truncated at 5,000 opt-steps on 1.3.0's exact LR
  #        trajectory, so steps 1000-5000 compare point for point against
  #        1.3.0's curve. Measures what SPD actually contributes.
  #        Outcome: fleurs unchanged (fr+en macro -0.05, noise) but clearly
  #        worse in-domain with a growing gap (4-set avg 6.94 vs 6.22 at
  #        step 5000, macro 8.09 vs 7.63) and already degrading by the end.
  #        Verdict: AdamSPD kept; see the optim block for the full numbers.
  # 1.4.0  rehearsal + longer anneal, optimizer settled by the ablation.
  #        Adds 300 h of Common Voice 22.0 (200 fr + 100 en, ~11% of
  #        audio-seconds, replay of pretraining data) against the forgetting
  #        seen on fleurs-EN and unmonitored languages (1.3.0: sv +2.9,
  #        fi +4.0), and stretches the run to 15,000 opt-steps (~1.7 epochs
  #        of the enlarged corpus, ~24.5 h) since 1.3.0 was still improving
  #        at its 10k stop. Everything else inherits from 1.3.0.
  #        Outcome (2026-08-29, one launch, ~24 h): NEW OVERALL BEST, macro
  #        6.68 @ step 11519 (norm 4.56) vs 7.08 for 1.1.0 and 7.21 for
  #        1.3.0; plateau 10.5k-14.5k, endpoint 6.74, so 15k was right-sized
  #        (optimum inside the low-LR tail, no drift). Rehearsal cost nothing
  #        in-domain: 4-set avg 5.52 vs 5.67 (1.3.0). fleurs fr 8.48 / en
  #        9.56, both at-or-below the pretrained baseline (8.55 / 10.38), so
  #        CV replay erased the fr+en forgetting outright; those two are now
  #        near-in-distribution rather than strict canaries, the clean ones
  #        being de/it/sv/fi + united_syn_med. Of those, it/de/united stayed
  #        ~flat but sv (20.2 -> 22.4) and fi (19.3 -> 23.1) still slid:
  #        rehearsal only protects what it covers. Measured epoch = 76,152
  #        batches = 9,519 opt-steps, so 15k = 1.58 epochs and the epoch-
  #        boundary val-counter reset made 14 rounds, not 15 (no round at
  #        10000; first epoch-1 round at 10519). .nemo export = best @ 11519.
  # 1.5.0  extends CV rehearsal to the four remaining monitored languages
  #        (de 20.0 h, it 20.0 h, sv-SE 9.1 h, fi 2.6 h; the last two are
  #        their full CV train pools), targeting the sv/fi slide that fr/en
  #        replay could not reach in 1.4.0. Rehearsal now 351.7 h = 12.6%
  #        of audio-seconds; UltiMed share 86.2%. Everything else inherits
  #        from 1.4.0: same 15k steps (the 10.5k-14.5k plateau showed the
  #        budget is right-sized, and the corpus grew only ~1.9%), same
  #        AdamSPD, same monitor. Estimated ~9,700 opt-steps/epoch, so
  #        ~1.55 epochs and again 14 val rounds. Launched overnight
  #        2026-08-30 by the user's timer after a green dry-run audit.
  #        Outcome (2026-08-31, one launch, 22.0 h, measured 78,342
  #        batches/epoch = 9,793 opt-steps): mission accomplished on the
  #        target languages at zero in-domain cost, but the MONITORED metric
  #        cannot see it. combined_macro (whose sources are only the 4
  #        in-domain sets + fleurs fr/en) read 6.78 @ 11793 vs 6.68 for
  #        1.4.0; decomposition: in-domain 4-set 5.55 vs 5.52 (tie), fr
  #        +0.35, en +0.09 (run-to-run noise scale). Meanwhile the pinned
  #        languages, logged but OUTSIDE the macro: fi 18.6 endpoint vs 23.1
  #        (-4.5, back at its pre-finetune level from 2.6 h of replay), sv
  #        20.2 vs 22.4 (-2.2, likewise flat all run), de 10.1 vs 10.6
  #        (-0.5), it unchanged. Averaged over all 15 logged sets 1.5.0 is
  #        clearly the better model; on the 6-source monitor it looks 0.10
  #        worse. Lesson for 1.6.0: add a fleurs_macro over all six fleurs
  #        sets (observability) and consider a balanced monitor so
  #        checkpoint selection sees what rehearsal protects. .nemo export
  #        = best @ 11793.
  #
  # This is also the run directory name, so a new value starts a clean run and
  # leaves the previous one resumable.
  version: "1.5.0"

  # Only save the best model based on validation CER
  create_checkpoint_callback: true
  checkpoint_callback_params:
    # NeMo names the WER metric "val_wer" and prefixes the per-dataset
    # variants: diyval_wer, drug_sentenceval_wer, etc. The normalised twins add
    # a _norm suffix (see normalised_wer below) and are logged, not monitored.
    # Monitor the combined macro (see macro_metrics above): FLEURS FR+EN
    # anchors + the three main UltiMed slices. A French-only or in-domain-only
    # monitor is blind to language tipping: training data is ~99% French TTS,
    # so the model could drift its language prior toward French and look
    # great in-domain while regressing elsewhere. (Same failure mode hit
    # during the SmoothQuant calibration of this model, where degraded
    # English embeddings tipped outputs into English; see the HF repo linked
    # in the latent_augment section.)
    monitor: "combined_macro_val_wer"
    mode: min  # Lower is better
    # 5 rather than 2: with no early stopping the run goes the full 12 epochs,
    # so keeping a wider band of the best checkpoints leaves room to compare
    # them afterwards (and to average them) instead of trusting one val point.
    # ~3.2 GB each, so 5 + last + the .nemo export is ~22 GB.
    save_top_k: 5
    save_last: true
    save_best_model: true
    # {step} is REQUIRED: validation runs many times per epoch, so an
    # epoch-only filename would collide/overwrite across rounds.
    filename: "parakeet-tdt-ultimed-{epoch}-{step}-{combined_macro_val_wer:.4f}"
    always_save_nemo: true  # Save as .nemo format

  # Logging
  create_tensorboard_logger: true
  create_wandb_logger: false

  # Resume from checkpoint on crash
  resume_if_exists: true
  resume_ignore_no_checkpoint: true
  # resume_from_checkpoint: path/to/checkpoint


# ============================================================================
# CONFIG AUDIT
# ============================================================================
# Crash before trainer.fit() if this file does not mean what it says.
#
# It exists because six settings here turned out to be inert, and every one of
# them looked perfectly fine in the YAML:
#   optim.weight_decay        read, but AdamSPD's maths ignored it
#   decoding (top level)      read by nothing; strategy inherited from the .nemo
#   cache_variants_per_sample at the top level, consumer reads model.*, so 1 not 6
#   model.seed                no consumer at all, the run was unseeded
#   bucketing_strategy        tarred-datasets only
#   persistent_workers        accepted here, dropped by NeMo's train dataloader
#
# Two checks, because no single one catches all three failure modes:
#   Layer 1 records every key actually read during setup and crashes on any
#           that were not. Catches wrong nesting level, typos, dead consumers.
#   Layer 2 re-reads the settings that matter back off the objects that were
#           built (decoder, optimizer, batch sampler, dataloaders) and crashes
#           on any that did not survive. Catches read-then-discarded.
# A third mode, wired-but-inert (the weight_decay bug), is invisible to both
# and needs a behavioural test: tests/collections/asr/test_adam_spd.py.
#
# Both run after setup and before the first training step, so a false positive
# costs a two-minute restart rather than days.
config_audit:
  enabled: true

  # A/B escape hatch. An ablation arm that must replicate a longer run's LR
  # trajectory keeps that run's optim.sched.max_steps and truncates with
  # trainer.max_steps instead, so its mid-run validation points compare like
  # for like against the reference curve. That mismatch is exactly what the
  # schedule-coherence check exists to catch, so it has to be acknowledged
  # here, per run, from the launcher (perso/run_ablation_nospd.sh does). Only
  # the truncation direction is excusable; a cosine shorter than the run still
  # fails. Leave false for every real training run.
  allow_truncated_anneal: false

  # Keys that are legitimately unread. Each one is an assertion that the key is
  # dead *on purpose*, so keep the reason attached. A trailing '.*' exempts a
  # subtree. Anything not listed here crashes the run.
  allow_unused:
    # --- covered by layer 2 instead of layer 1 ---
    # change_decoding_strategy copies the block before reading it, so layer 1
    # cannot see these reads. Layer 2 checks all four against the live decoder
    # object (strategy, model_type, durations, and max_symbols on the greedy
    # decoder itself), which is stronger evidence than a read record anyway.
    - decoding.model_type
    - decoding.durations
    - decoding.greedy.max_symbols

    # --- inert while use_cached_encoder is false ---
    # The whole cached-encoder path is off, so nothing reads its settings.
    # Flip use_cached_encoder to true and these must come back off this list.
    - encoder_cache_dir
    - encoder_cache.*
    - model.latent_augment.*

    # --- read by a different script ---
    # Only perso/precompute_encoder_cache.py consumes this, and only when
    # building a cache. Training never reads it.
    - model.cache_variants_per_sample

    # --- consumed, but through an interpolation layer 1 cannot see ---
    # exp_manager.name is ${name}, and OmegaConf resolves interpolations via
    # _get_node, which bypasses the three read paths the audit patches. So this
    # key is genuinely used and still never shows up as read. Layer 2 checks the
    # run directory the trainer actually got and fails if the name is missing
    # from it, which is what keeps this entry honest.
    - name
