# ============================================================================
# Goal: teach the model French medical vocabulary at scale (UltiMed-ASR-FR)
# without hurting its general-purpose / multilingual accuracy.
#
# Training mix (balanced view is AUDIO-HOURS, not clip counts):
#
#   Figures below are what actually reaches the model, i.e. AFTER the 38 s
#   max_duration cap (see train_ds.max_duration for why the cap exists).
#
#   Dataset          Train clips   Hours    Share   Licence
#   ---------------  -----------  -------  ------  -----------------
#   UltiMed-ASR-FR       479,246  2,398.3   98.7%  own (CC BY 4.0)
#   diy                    4,528     21.7    0.9%  own TTS output
#   drug_sentence          4,099      9.7    0.4%  own TTS output
#   ---------------  -----------  -------  ------  -----------------
#   Total                487,873  2,429.6    100%
#
#   Uncapped the mix would be 494,667 clips / 2,515.7 h, so the cap now costs
#   only 3.4% of the hours. It used to cost 13.2% at the old 25 s cap: the
#   adaptive batch sampler (train_ds.cost_batching) is what bought that back,
#   by sizing each batch to a memory budget instead of a fixed clip count.
#
#   united_syn_med was REMOVED from training: it is CC BY-SA 4.0
#   (ShareAlike), which is legally murky for a released model and
#   incompatible with the planned permissive release. It stays in
#   val/test for regression tracking (evaluation is not distribution).
#   fleurs stays out of training; val/test unchanged for tracking.
#
#   UltiMed-ASR-FR (https://huggingface.co/datasets/Olicorne/UltiMed-ASR-FR):
#   601k clips / 3,105 h of synthetic French medical speech (Voxtral TTS,
#   single voice fr_female, 24 kHz FLAC; NeMo resamples to 16 kHz on the
#   fly). Sources: dictionary (85.6% of hours), PARHAF (11.8%),
#   drugs (2.5%), acronyms (0.1%). PARROT subset is CC BY-NC-SA,
#   EVAL-ONLY: never in train, used as out-of-domain radiology monitor.
#
#   Validation: fleurs (de en fr fi it sv) + diy + drug_sentence + oli +
#   united_syn_med + seeded UltiMed slices (built by
#   perso/build_ultimed_val_slices.py, ~8 h total).
#
#   Single-voice caveat: the whole new corpus is one TTS voice, so audio
#   augmentation (white noise / gain / RIR) + SpecAugment time masks +
#   the two old sets' different voices are the guard against overfitting
#   to that voice's acoustics.
# ============================================================================
#
# Fine-tuning configuration for parakeet-tdt-0.6b-v3 on French medical audio
# Training script: examples/asr/speech_to_text_finetune_cached.py
#   (despite the name it is the entry point for BOTH modes; with
#   use_cached_encoder: false it trains the standard way while keeping the
#   fork's extras: partial encoder unfreeze, AdamSPD, macro metrics,
#   frozen-module eval pinning.)
# Run with perso/training_start.sh (crash-relaunch wrapper), or directly:
#   python examples/asr/speech_to_text_finetune_cached.py \
#       --config-dir=$PWD/perso --config-name=training_config
# Model will be loaded from pretrained and tokenizer will be kept as-is

name: "parakeet-tdt-ultimed-french-medical"

# ============================================================================
# Cached encoder training (optional, for speed)
# When the encoder is frozen, we can precompute its outputs once and train
# only decoder+joint on cached features.  This eliminates the encoder forward
# pass (~97% of compute) from every training step.
#
# To use:
#   1. Run  precompute_encoder_cache.py  to generate the cache.
#   2. Set  use_cached_encoder: true  below.
#   3. Run  speech_to_text_finetune_cached.py  instead of the standard script.
#
# DISABLED for the UltiMed run: the cache stores encoder outputs per variant,
# ~230 GB per variant for the 2,516 h corpus, x6 variants = ~1.4 TB. No disk
# for that, and partial unfreeze (last 4 layers) shrinks the compute win
# anyway. speech_to_text_finetune_cached.py with use_cached_encoder: false
# trains the standard way (encoder forward on GPU each step).
# ============================================================================
use_cached_encoder: false
encoder_cache_dir: "./perso/encoder_cache_ignore_backups"

# Encoder cache management. Only applies when use_cached_encoder is true.
encoder_cache:
  # Check freshness and rebuild automatically before training starts.
  # Set to false to manage the cache manually via precompute_encoder_cache.py.
  auto_rebuild: true
  # Also compute per-dimension augmentation stats (cache_stats.json).
  # Only useful when latent_augment.enabled is true.
  compute_stats: false

# Number of cached variants per audio sample (requires re-running
# precompute_encoder_cache.py with --variants-per-sample N):
#   - Variant 0: always clean (eval mode, no augmentation).
#   - Variants 1..N-1: augmented draws from train_ds.augmentor + spec_augment.
#     asr_model.train() is set during generation, so encoder dropout also
#     contributes additional stochasticity (intentional).
# At training time the dataset randomly picks one variant per __getitem__.
# With N>1, real audio augmentations (RIR, white noise, gain) are faithfully
# captured by the encoder rather than approximated by latent Gaussian noise.
# Recommend reducing latent_augment.noise_scale_multiplier to 0.1-0.2 when
# using multiple variants (real augmentations already provide most variability).
# Disk cost: ~N× the clean cache size.
# MOVED under model: on 2026-08-23. It lived at the top level until then, but
# precompute_encoder_cache.py reads it as model.cache_variants_per_sample, so
# the top-level value was never seen and the cache builder silently used its
# default of 1 instead of this 6. Dormant while use_cached_encoder is false,
# but it would have quietly built a 6x smaller cache. Found by the config
# audit (see nemo/collections/asr/parts/utils/config_audit.py).

# Pretrained model initialization
# Use init_from_pretrained_model for automatic download from NGC
init_from_pretrained_model: "nvidia/parakeet-tdt-0.6b-v3"
# Alternative: Use init_from_nemo_model if you have a local .nemo file
# init_from_nemo_model: "/path/to/parakeet-tdt-0.6b-v3.nemo"

model:
  # Seed for deterministic training: data shuffling, dropout, augmentation.
  # Applied via lightning.seed_everything() at the top of main(). It was read
  # by nothing at all until 2026-08-23, so the run was unseeded despite this
  # being set; found by the config audit.
  # Note the cost batch sampler carries its own independent seed in
  # model.train_ds.cost_batching.seed.
  seed: 42424242

  # Number of encoder-cache variants to precompute per sample. Only used by
  # perso/precompute_encoder_cache.py, i.e. only when use_cached_encoder is
  # true. Moved here from the top level on 2026-08-23, see the note there.
  cache_variants_per_sample: 6

  # Model architecture summary (parakeet-tdt-0.6b-v3):
  #
  #   Component          Type                              Params   Mode
  #   ----------------   -------------------------------   ------   -----
  #   preprocessor       AudioToMelSpectrogramPreprocessor      0   train
  #   encoder            ConformerEncoder                  608  M   last 4 of 24
  #                                                                 layers train
  #   decoder            RNNTDecoder                        11.8M   train
  #   joint              RNNTJoint                           6.3M   train
  #   loss               RNNTLoss                                0   train
  #   spec_augmentation  SpectrogramAugmentation                 0   train
  #
  #   Trainable:  ~120M  (4 conformer layers ~100M + decoder + joint)
  #   Frozen:     ~508M  (encoder layers 0-19 + pre_encode + pos_enc)
  #   Total:       627M  (~2.5 GB weights in bf16/fp32 mix)
  #
  # Freeze specific model components to preserve general capabilities.
  # The training script reads these flags and calls .freeze() accordingly.
  # For a transducer (TDT) model the components are:
  #   encoder  – large acoustic feature extractor (~95% of params)
  #   decoder  – small prediction/language-model network
  #   joint    – small network combining encoder + decoder outputs
  # For the UltiMed run: 3,105 h of new French medical vocabulary justifies
  # letting the top of the encoder move (phonetic/lexical abstractions live
  # there; bottom layers stay pretrained to preserve multilinguality), and
  # AdamSPD + the frozen bottom + FLEURS monitoring guard against drift.
  # Frozen modules are also PINNED TO EVAL MODE for the whole run by
  # _FrozenEvalCallback in the training script: in standard (non-cached)
  # mode the frozen layers still run forward, and Lightning's model.train()
  # would otherwise let their BatchNorm running stats drift for 10 days.
  freeze:
    encoder: true
    # Unfreeze the last N conformer layers (+ out_proj) of the encoder.
    # 0 → full encoder freeze.
    # >0 → partial freeze. In cached mode the cache must be regenerated at
    #      the matching cut layer; in standard mode (current setup) no cache
    #      is involved.
    #
    # History, measured on the same harness against the pretrained baseline
    # (combined_macro 18.43, in-domain 4-set macro 22.91, fleurs fr+en 9.47):
    #
    #   1.1.0, N=4 (118.9M trainable, 19%): best macro 7.08 at step 7500.
    #     Ran to step 34228 and ended at 9.11 with fleurs fr+en at 18.78.
    #   1.2.0, N=0 (18.1M trainable, 2.9%): macro bottomed out at 9.61 by step
    #     15432 and flattened there. Forgetting was a seventh of 1.1.0's at the
    #     same step (fleurs fr+en +0.48 vs +3.43), so the freeze did its job,
    #     but in-domain stalled at 9.43 against 1.1.0's 5.38 at step 7500. With
    #     the encoder fixed, the decoder and joint cannot get under it.
    #
    # 1.2.0's best was worse than 1.1.0's WORST, so a full freeze is the wrong
    # end of the range. The real fault in 1.1.0 was duration, not N: its macro
    # was already best at step 7500 and its LR was still at peak there, because
    # sched.max_steps was set for 12 epochs. It drove through the optimum.
    #
    #   1.3.0, N=4 + 10k anneal (118.9M trainable): 7.21 at the endpoint,
    #     which was also the best point; no drift phase. In-domain 5.67,
    #     fleurs fr+en 10.31. Confirms the frontier at this N and duration.
    #
    # 1.3.0 went BACK to N=4 rather than interpolating to 2, because
    # under the monitored macro the arithmetic favours the known trajectory:
    # beating 7.08 needs the in-domain 4-set at <=5.4 with N=4's measured
    # forgetting (+1.0 fleurs fr+en), which N=4 already demonstrated at step
    # 7500, or at <=5.7 with N=2's hoped-for +0.3, which requires the last two
    # layers alone (half the N=4 encoder mass) to close ~92% of the 4-point
    # in-domain gap 1.2.0 exposed. The first is a demonstrated fact, the
    # second is a bet. What actually changes in 1.3.0 is the schedule: the
    # cosine now lands ON the optimum instead of driving past it, see
    # trainer.max_steps below. N=2 remains the fallback if the end-state
    # forgetting is unacceptable; rehearsal data is the lever after that.
    encoder_except_last_n: 4
    joint: false
    decoder: false

  # Latent-space augmentation for cached-encoder training.
  # Replaces SpecAugment + audio augmentors when use_cached_encoder is true.
  # Ignored in standard training mode.
  latent_augment:
    # Set enabled: false to skip all latent augmentation (no-op pass-through).
    # Default is false; set to true to activate the augmentations below.
    enabled: false
    # Per-dimension noise from cache_stats.json (computed by
    # precompute_encoder_cache.py --compute-stats).  When the stats file
    # exists, each encoder dimension gets noise proportional to its
    # empirical std under real audio augmentations, instead of the uniform
    # gaussian_noise_scale below.
    # use_per_dim_noise: true        # use per-dim stats if cache_stats.json exists
    noise_scale_multiplier: 0.001    # scale factor applied to empirical per-dim std
                                   # reduce to 0.1-0.2 when cache_variants_per_sample > 1
                                   # (real augmented variants then provide most variability)
    gaussian_noise_scale: 0.001    # fallback if no stats file — ~12% of mean activation magnitude (0.0171)
    feature_dropout: 0          # probability of zeroing a feature dimension (0 disables)
                                   # lowered from 0.05; outlier dims are now exempt (see below)
    # time_mask_num: 1               # number of contiguous time masks per sample
    # time_mask_width: 5             # max width (encoder frames) of each time mask
    # Outlier-dim protection (computed by precompute_encoder_cache.py --compute-stats).
    # Transformer encoders have a small set of "outlier features" with
    # disproportionately large magnitudes that carry disproportionate signal
    # (cf. Dettmers et al., LLM.int8()). Protected dims receive zero noise and
    # are never zeroed by feature_dropout. Time masking is unaffected.
    # Empirically validated for this exact model by the SmoothQuant int8 export
    # (https://huggingface.co/Olicorne/parakeet-tdt-0.6b-v3-smoothquant-onnx):
    # the 46 worst-quantizing MatMuls were all FFN linear2 down-projections
    # (where per-channel activation outliers live), with a clean loss gap
    # before the first attention layer. Two lessons for perturbing cached
    # latents here: (1) protecting outlier dims from noise/dropout is the
    # right shape, and (2) one uniform noise scale across all dims is
    # structurally the same per-tensor mistake that made naive int8 collapse
    # on long audio, so prefer the per-dim stats path if re-enabling noise.
    # outlier_top_k_frac: 0.05           # protect top 1% of dims by mean-abs activation
    # outlier_kurtosis_threshold: 20.0   # also protect dims with kurtosis above this (Gaussian≈3)

  # L2-SP: L2 regularization toward pretrained weights (Xuhong et al., 2018).
  # Disabled in favor of AdamSPD (Selective Projection Decay), which
  # achieves the same goal but operates inside the optimizer step and
  # only decays weights when the gradient pushes them *further away*
  # from pretrained values. See optim section below.
  l2sp:
    enabled: false          # disabled — SPD (via AdamSPD optimizer) replaces this
    # lambda: 0.005           # kept for reference if re-enabling

  # Keep existing tokenizer - do not retrain
  tokenizer:
    update_tokenizer: false

  # RNNT/TDT joint: the single biggest memory knob on this GPU.
  #
  # The joint materializes a [B, T, U, V] lattice, V = 8198 (8192 vocab +
  # blank + 5 TDT duration outputs), T = duration * 12.5 (8x subsampling on a
  # 10 ms hop) and U = tokens + 1. This corpus runs about 10 tokens/s, so a
  # 25 s clip is 312 * 196 * 8198 = 501 M elements. The loss keeps a dense
  # fp32 gradient tensor of that shape alive until backward, and transiently
  # holds a bf16 copy plus an fp32 cast of it as well.
  #
  # fuse_loss_wer already splits joint+loss into sub-batches, but the
  # pretrained checkpoint ships fused_batch_size=4. At batch_size=4 that is
  # one single sub-batch, so every clip gets padded to the longest one in the
  # batch and the cost is B * max(T) * max(U) * V. Measured: a batch of four
  # 45 s clips asks for a single 20.87 GiB allocation and dies.
  #
  # fused_batch_size=1 processes one clip at a time, so the cost follows
  # sum_i(T_i * U_i) with no padding amplification. Only the fp32 gradient
  # tensors stay resident across the sub-batches; the large transients live
  # for one clip at a time.
  joint:
    fused_batch_size: 1

  # Training dataset configuration
  train_ds:
    # Multiple training manifests are concatenated by NeMo (one pass over
    # every listed manifest = one epoch).
    #
    # BALANCE BY AUDIO-SECONDS, NOT CLIP COUNT. RNNT loss per sample grows
    # with utterance length, so gradient exposure follows audio time.
    # Mix by hours after the 38 s cap: UltiMed 2,398.3 h (86.2%), Common
    # Voice rehearsal 351.7 h (12.6%: fr 200.0, en 100.0, de 20.0, it 20.0,
    # sv-SE 9.1, fi 2.6, the last two being their full CV train pools),
    # diy 21.7 h (0.8%), drug_sentence 9.7 h (0.3%); total ~2,781.4 h.
    # The two old sets are kept less for their weight than for their
    # different TTS voices (UltiMed is single-voice) and as continuity with
    # the previous runs. No upsampling: UltiMed IS the target domain, and
    # the CV share is set by how many hours were physically sampled (see
    # the prep script).
    manifest_filepath:
      # UltiMed-ASR-FR train split: 486,007 clips / 2,484 h on disk, 479,246
      # clips / 2,398.3 h after the 38 s cap (dictionary + drugs + PARHAF +
      # acronyms; NO PARROT, it is eval-only CC BY-NC-SA; NO val/test rows).
      # Verified by scanning the manifest: every audio path resolves to
      # dictionary/, PARHAF/, drugs/ or acronyms/, all CC BY 4.0, so a
      # permissive release of the fine-tune is clean.
      # Audio paths inside are relative to the manifest
      # directory; perso/ultimed_data_ignore-backups is a symlink to the
      # dataset root on the SSD, so nothing user-specific is committed.
      # 24 kHz FLAC, resampled to 16 kHz on the fly by the dataloader.
      - "./perso/ultimed_data_ignore-backups/NeMO_files/train.jsonl"
      # sentences containing drugs and dosages read out loud by TTS (4100 samples)
      - "./perso/drug_sentence_dataset/train.json"
      # DIY medical dataset
      - "./perso/nemo_dataset/train.json"
      # United Synthetic Medical dataset: REMOVED from training (CC BY-SA
      # 4.0 ShareAlike, incompatible with the planned permissive release of
      # the fine-tuned weights). Still evaluated in val/test.
      # - "./perso/downloaded_datasets_ignore-backups/united_syn_med/train/train.unparenthesized.uncapitalized.kept.down-8k.wo_commas.json"
      # FLEURS train splits: NOT used. fleurs is the external forgetting
      # canary (fr+en are in the monitored macro), so training on it would
      # blind the one probe that is clean. The local splits are also tiny
      # (~2.3 h/language), too small to rehearse with anyway.
      # - "./perso/downloaded_datasets_ignore-backups/fleurs/en/train.altered.json"
      # - "./perso/downloaded_datasets_ignore-backups/fleurs/fr/train.altered.json"
      # Common Voice 22.0 rehearsal (new in 1.4.0): 139,437 clips / 200.0 h fr
      # + 61,164 clips / 100.0 h en, sampled (seed 42) and converted to 16 kHz
      # mono FLAC by perso/prepare_commonvoice_rehearsal.py. Sentences are the
      # original cased+punctuated CV text, so the style matches the model's
      # output convention. CV (MCV v7.0) is part of parakeet v3's pretraining
      # set, making this replay-style rehearsal against the forgetting every
      # earlier run showed on fleurs-EN and the unmonitored languages
      # (1.3.0: sv +2.9, fi +4.0 vs baseline). ~11% of audio-seconds, 2:1
      # fr:en to favour the deployment language without abandoning English.
      # CC0-1.0, so the planned permissive release stays clean. Reached via
      # the gitignored symlink perso/downloaded_datasets_ignore-backups/
      # commonvoice -> the dataset drive; audio paths are relative to the
      # manifest like the UltiMed set above.
      - "./perso/downloaded_datasets_ignore-backups/commonvoice/cv_fr_train.jsonl"
      - "./perso/downloaded_datasets_ignore-backups/commonvoice/cv_en_train.jsonl"
      # 1.5.0: the four remaining monitored languages get the same treatment,
      # after 1.4.0 proved fr/en replay erases forgetting at zero in-domain
      # cost while unprotected sv (+2.2 within-run) and fi (+3.8) kept
      # sliding. de/it at 20 h each; sv-SE and fi are their entire CV train
      # pools (9.1 h / 2.6 h), which is why they are smaller. FLEURS itself
      # stays strictly out of training so its val sets remain out-of-corpus
      # probes for every language.
      - "./perso/downloaded_datasets_ignore-backups/commonvoice/cv_de_train.jsonl"
      - "./perso/downloaded_datasets_ignore-backups/commonvoice/cv_it_train.jsonl"
      - "./perso/downloaded_datasets_ignore-backups/commonvoice/cv_sv-SE_train.jsonl"
      - "./perso/downloaded_datasets_ignore-backups/commonvoice/cv_fi_train.jsonl"
    sample_rate: 16000

    # Standard (non-cached) mode: the full encoder runs on GPU each step.
    #
    # batch_size is only a FALLBACK now: with cost_batching enabled below, each
    # batch is sized by memory cost and this value is ignored. It is what NeMo
    # builds the dataloader with before the sampler replaces it, and what a run
    # with cost_batching disabled would use.
    #
    # Measured worst case with a FIXED batch size (200 clips all sitting at the
    # cap with the longest transcripts available at that length, i.e. every
    # batch is the worst batch training can draw), peak VRAM out of 24564 MiB:
    #   cap 25 / batch 4 -> 23353  OK
    #   cap 25 / batch 6 -> 23940  OK   (only 624 MiB spare)
    #   cap 30 / batch 2 -> 21130  OK
    #   cap 30 / batch 3 -> 23983  OK   (only 581 MiB spare)
    #   cap 35 / batch 2 -> 23948  OK   (only 616 MiB spare)
    #   cap 40 / batch 1 -> 23409  OK   (1155 MiB spare)
    #   cap 30 / batch 4 -> OOM
    #   cap 35 / batch 4 -> OOM
    #   cap 40 / batch 4 -> OOM
    #   cap 45 / batch 1 -> OOM  (needed 5.18 GiB more than the card has)
    # Those ten points are what the cost model below was fitted on. On the real
    # (mixed-length) manifests the peak is far lower; they are the ceiling.
    #
    # OOM FALLBACK (technique de gitan, in order):
    #   1. cost_batching.budget: 13000 (cheapest, shrinks every batch at once,
    #      and drop max_duration to 36.0 to match: see the sqrt rule below)
    #   2. cost_batching.max_total_duration: 180.0 (only bites short-clip batches)
    #   3. cost_batching.enabled: false, batch_size 4, max_duration 25.0
    #      (falls back to the previously validated fixed-batch setup)
    batch_size: 4

    # --- Adaptive batch size ------------------------------------------------
    # Packs every batch up to a memory budget instead of a fixed clip count, so
    # one batch is a single 38 s clip and the next is sixteen 14 s ones.
    # Implemented as DurationCostBatchSampler in
    # nemo/collections/asr/parts/utils/asr_batching.py and wired in by
    # examples/asr/speech_to_text_finetune_cached.py (apply_cost_batch_sampler).
    #
    # Why: the joint lattice costs roughly the SQUARE of the clip duration, so a
    # fixed batch size has to be sized for the longest clip the manifest can
    # produce, which wastes most of the GPU on the short ones. That is what
    # forced the old 25 s cap and threw away 81% of PARHAF's hours.
    #
    # cost = 4 * sum(d^2) + 6 * max(d^2), fitted on the ten measurements above:
    # every passing one scores <= 18750 and every failing one >= 19800. The
    # second term is the transient of the largest clip alone, because with
    # joint.fused_batch_size 1 the joint processes one clip at a time.
    #
    # Measured effect on this corpus (both on the real manifests):
    #   batches/epoch    114,459 of a flat 4   ->  63,452 of 1 to 16 (mean 7.7)
    #   audio per batch          69 s          ->  138 s (max 234 s)
    #   throughput        142.2 audio-s/wall-s ->  221.4 audio-s/wall-s  (+56%)
    #   corpus kept       86.8% of hours       ->  96.6% of hours
    #   PARHAF kept       18.6% of its hours   ->  69.0% of its hours
    # So it is faster AND trains on more data, because the old fixed batch size
    # was sized for a worst case that almost never occurred.
    #
    # Known and accepted side effect: the RNNT loss reduces with mean_batch, and
    # gradient accumulation weights every micro-batch equally, so a batch of one
    # 38 s clip carries the same gradient weight as a batch of sixteen short
    # ones. Long clips are therefore upweighted about 8x per clip. That is a
    # feature here (long-form is the weak point this fine-tune targets) but it
    # is a real reweighting of the corpus, not a neutral change.
    cost_batching:
      enabled: true
      # 15000 leaves a measured ~2.2 GB of true headroom on the worst possible
      # batch mix. Verified two ways, because nvidia-smi lies here: it reports
      # ~23.6 of 24.5 GB, but that is the caching allocator holding freed blocks,
      # not need. Re-running the worst case while a second process held 1.0 GB
      # of the card still PASSED, and the OOM messages when holding 2.0 and
      # 2.5 GB both put the true peak at ~21.3 GiB. Budgets of 14000 and 15000
      # report the same nvidia-smi peak, which is the giveaway.
      # This is still the first thing to lower on an OOM.
      budget: 15000
      # Hard cap on clips per batch so a run of very short clips cannot build a
      # huge one. Binds on about 13% of batches.
      max_batch_size: 16
      # Cap on the summed audio in a batch. The squared-duration cost above only
      # models the joint; the encoder and preprocessor activations scale with
      # total audio instead, and this bounds them.
      max_total_duration: 240.0
      # Batches are packed from windows of this many shuffled clips, sorted by
      # duration inside the window. The encoder pads every clip up to the
      # longest in its batch, so mixing a 3 s clip with a 39 s one would spend
      # most of the batch on padding. Sorting inside a window rather than
      # globally still gives different batches every epoch.
      sort_pool_size: 512
      seed: 42

    trim_silence: false

    # Max duration in seconds. With cost batching this is no longer the OOM
    # guard (the budget is). It is the point past which a clip cannot be trained
    # on this card even on its own: 40 s alone peaks at 23409 MiB, and 45 s
    # alone OOMs, needing 5.18 GiB more than the card has.
    #
    # Tie it to the budget: a clip alone costs 10 * d^2, so the largest clip the
    # budget can hold is sqrt(budget / 10) = 38.7 s at budget 15000. 38.0 keeps
    # a little slack. The sampler warns at startup if any clip exceeds that, and
    # emits it alone anyway, which may OOM, so change the two together.
    #
    # 38 s keeps 487,873 clips / 2,429.6 h, i.e. 96.6% of the hours, against
    # 86.8% at the old 25 s cap. PARHAF (hospital reports, median 29.9 s) goes
    # from keeping 18.6% of its hours to 69.0%, so long-form training data goes
    # from 51 h to 190 h.
    #
    # Validation is NOT capped and still sees clips up to 44.8 s; that path runs
    # without gradients and peaks at 17.9 GB, so it is safe.
    max_duration: 38.0
    min_duration: 1.0

    shuffle: true
    # 58k batches/epoch for ~10 days: workers mostly decode+resample FLAC
    # (24->16 kHz). 8 workers on 12 cores keeps the GPU fed while leaving
    # room for the val loaders (num_workers 2 each, non-persistent).
    # Batches are ~2x bigger under cost batching, so each worker does more work
    # per item and prefetch_factor 4 buys more slack than it used to.
    num_workers: 8
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true

    # Inert here: NeMo only honours these two for TARRED datasets, and this run
    # uses plain manifests. Length-aware batching comes from cost_batching above
    # (which sorts by duration inside each sort_pool_size window).
    bucketing_strategy: "synced_randomized"
    bucketing_batch_size: null  # null means use batch_size

    # Online data augmentation, applied on-the-fly in the dataloader
    # workers. ACTIVE in standard (non-cached) mode - and important here:
    # UltiMed is a single clean TTS voice, so noise/gain/RIR are the main
    # defence against overfitting to that voice's acoustics.
    # (Ignored only when use_cached_encoder is true.)
    augmentor:
      # Allowed values : dict_keys(['speed', 'time_stretch', 'gain', 'silence', 'impulse', 'shift', 'noise', 'noise_norm', 'white_noise', 'rir_noise_aug', 'transcode_aug', 'random_segment'])
      # # White noise augmentation
      # # Adds realism since TTS-generated audio is too clean
      white_noise:
        prob: 0.5  # 50% of samples get noise. Values: 0.0-1.0
        min_level: -40  # Minimum noise level in dB. Range: -60 to -20
        max_level: -20  # Maximum noise level in dB. Range: -40 to 0
        # More negative = quieter noise
        # Recommended for medical: -50 to -20 (subtle background noise)
      # # Optional: Gain/volume perturbation (uncomment to enable)
      # # Helps model handle different recording volumes
      gain:
        prob: 0.5
        min_gain_dbfs: -10
        max_gain_dbfs: 10

      # Room impulse response augmentation
      # Simulates different acoustic environments (rooms, halls, etc.)
      # You need a manifest of impulse response audio files for this
      # Download from: OpenSLR (e.g., "rir_noises" dataset) or record your own
      impulse:
        prob: 0.3  # 30% of samples. Adjust 0.0-1.0
        manifest_path: "./perso/downloaded_datasets_ignore-backups/RIR/processed/rir.json"
        shift_impulse: true
        normalize_impulse: true

